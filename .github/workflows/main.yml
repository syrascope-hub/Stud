name: Build Stud APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or unzip project
        id: prep
        run: |
          set -e
          if [ -f pubspec.yaml ]; then
            DIR="."
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
            if [ -n "$ZIP" ]; then
              unzip -q -o "$ZIP" -d _src
              P=$(find _src -name pubspec.yaml -not -path '*/.*' | head -n1)
            else
              P=$(find . -maxdepth 3 -name pubspec.yaml -not -path '*/.*' | head -n1)
            fi
            if [ -z "$P" ]; then echo "pubspec.yaml not found (root, subfolder or zip)"; ls -la; exit 1; fi
            DIR=$(dirname "$P")
          fi
          VER=$(grep -m1 '^version:' "$DIR/pubspec.yaml" | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d '\r ')
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR | version: $VER"
          ls -la "$DIR" "$DIR/lib" "$DIR/assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter create . --platforms=android --project-name stud --org com.stud.app

      - name: Manifest - permissions, notification receivers, app name
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in INTERNET POST_NOTIFICATIONS VIBRATE RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" $M
          done
          if ! grep -q ScheduledNotificationReceiver $M; then
            sed -i 's#</application>#    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n    </application>#' $M
          fi
          sed -i 's#android:label="[^"]*"#android:label="Stud"#' $M
          cat $M

      - name: Gradle - enable core library desugaring (needed by notifications)
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF2'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF2
            cat android/app/build.gradle.kts
          else
            cat >> android/app/build.gradle <<'EOF2'

          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
          }
          EOF2
            cat android/app/build.gradle
          fi

      - name: Install dependencies
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter pub get

      - name: Analyze (shows Dart errors, never blocks)
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Generate app icon
        working-directory: ${{ steps.prep.outputs.dir }}
        run: dart run flutter_launcher_icons

      - name: Build universal APK
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Stud-${{ steps.prep.outputs.ver }}-universal.apk"

      - name: Build split APKs
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          flutter build apk --release --split-per-abi
          for A in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$A-release.apk" "dist/Stud-${{ steps.prep.outputs.ver }}-$A.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: stud-apk-${{ steps.prep.outputs.ver }}
          path: ${{ steps.prep.outputs.dir }}/dist/Stud-*.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.ver }}-build-${{ github.run_number }}
          name: Stud ${{ steps.prep.outputs.ver }} (build ${{ github.run_number }})
          files: ${{ steps.prep.outputs.dir }}/dist/Stud-*.apk
