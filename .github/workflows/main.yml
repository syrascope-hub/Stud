name: Build Stud APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate or unzip project
        id: prep
        run: |
          set -e
          if [ -f pubspec.yaml ]; then
            DIR="."
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
            if [ -z "$ZIP" ]; then
              echo "No pubspec.yaml and no .zip file found in repo root"; ls -la; exit 1
            fi
            unzip -q -o "$ZIP" -d _src
            P=$(find _src -name pubspec.yaml -not -path '*/.*' | head -n1)
            if [ -z "$P" ]; then echo "pubspec.yaml not found inside zip"; exit 1; fi
            DIR=$(dirname "$P")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR" "$DIR/lib" "$DIR/assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter create . --platforms=android --project-name stud --org com.stud.app

      - name: Add INTERNET permission and app name
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Stud"#' $M

      - name: Install dependencies
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter pub get

      - name: Generate app icon
        working-directory: ${{ steps.prep.outputs.dir }}
        run: dart run flutter_launcher_icons

      - name: Build universal APK
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: ${{ steps.prep.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: Rename outputs
        working-directory: ${{ steps.prep.outputs.dir }}/build/app/outputs/flutter-apk
        run: |
          mv app-release.apk Stud-universal.apk
          mv app-arm64-v8a-release.apk Stud-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk Stud-armeabi-v7a.apk
          mv app-x86_64-release.apk Stud-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stud-apk
          path: ${{ steps.prep.outputs.dir }}/build/app/outputs/flutter-apk/Stud-*.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stud build ${{ github.run_number }}
          files: ${{ steps.prep.outputs.dir }}/build/app/outputs/flutter-apk/Stud-*.apk
