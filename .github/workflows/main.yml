name: Build Stud APK (from zip)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f stud.zip || { echo "stud.zip not found in repo root"; ls -la; exit 1; }
          unzip -q -o stud.zip
          ls -la stud

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('stud.zip') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Android platform files
        working-directory: stud
        run: flutter create . --platforms=android --project-name stud --org com.stud.app

      - name: Add INTERNET permission and app name
        working-directory: stud
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Stud"#' $M

      - name: Install dependencies
        working-directory: stud
        run: flutter pub get

      - name: Build universal APK
        working-directory: stud
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: stud
        run: flutter build apk --release --split-per-abi

      - name: Rename outputs
        working-directory: stud/build/app/outputs/flutter-apk
        run: |
          mv app-release.apk Stud-universal.apk
          mv app-arm64-v8a-release.apk Stud-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk Stud-armeabi-v7a.apk
          mv app-x86_64-release.apk Stud-x86_64.apk
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stud-apk
          path: stud/build/app/outputs/flutter-apk/Stud-*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stud build ${{ github.run_number }}
          files: stud/build/app/outputs/flutter-apk/Stud-*.apk
